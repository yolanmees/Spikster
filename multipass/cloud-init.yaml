#cloud-config
# Basic Multipass cloud-init for Spikster testing
# Usage: multipass launch 24.04 --name spikster-test --cloud-init multipass/cloud-init.yaml

# Set hostname
hostname: spikster-test

# Set timezone
timezone: Europe/Amsterdam

# Update packages on first boot
package_update: true
package_upgrade: false  # Set to true for full upgrade (slower)

# Install basic utilities
packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - dnsutils

# Create swap file (1GB)
swap:
  filename: /swapfile
  size: 1073741824  # 1GB in bytes
  maxsize: 1073741824

# Create necessary directories
runcmd:
  - mkdir -p /tmp/spikster
  - mkdir -p /var/log/spikster
  - chmod 755 /tmp/spikster
  - echo "VM initialized at $(date)" > /tmp/spikster/ready.txt
  - echo "Ready for Spikster installation" >> /tmp/spikster/ready.txt

# Final message
final_message: |
  Cloud-init completed!
  Spikster test VM is ready.
  
  Next steps:
  1. Transfer installation script: multipass transfer new_install.sh <vm-name>:/tmp/
  2. Shell into VM: multipass shell <vm-name>
  3. Run installation: sudo bash /tmp/new_install.sh
  
  System boot finished at $TIMESTAMP after $UPTIME seconds
